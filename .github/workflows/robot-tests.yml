name: Robot Framework Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  robot-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install robotframework-browser allure-robotframework

      - name: Install Browser library dependencies
        run: |
          rfbrowser init

      - name: Prepare report directories
        run: |
          mkdir -p reports/robot
          mkdir -p allure-results

      - name: Run Robot Framework tests with Allure listener
        run: |
          robot \
            --listener allure_robotframework:allure-results \
            --outputdir reports/robot \
            robot/tests

      - name: Upload Robot HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-html-reports
          path: reports/robot/

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-allure-results
          path: allure-results/