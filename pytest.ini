[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v --tb=short --html=reports/report.html --self-contained-html

markers =
    smoke: critical happy path tests
    regression: broader functional regression tests
    integration: end-to-end or service interaction tests
    ui: UI automation tests
    api: API automation tests
    unit: unit tests for internal framework logic

log_cli = true
log_cli_level = INFO